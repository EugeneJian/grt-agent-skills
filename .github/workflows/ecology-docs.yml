name: Ecology Skill docs

on:
  pull_request:
    paths:
      - 'ecology/**'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/ecology-docs.yml'
  push:
    branches: [main]
    paths:
      - 'ecology/**'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/ecology-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s ecology/tests -v
      - run: git diff --check
